name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend typecheck
        working-directory: backend
        run: npm ci && npm run typecheck

  deploy-backend:
    name: Deploy Backend VM
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: SSH & deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_VM_HOST }}
          username: ${{ secrets.BACKEND_VM_USER }}
          key: ${{ secrets.BACKEND_VM_SSH_KEY }}
          script: |
            cd ~/octopi-saas-platform
            git pull origin main
            docker compose -f docker-compose.backend.yml build --no-cache
            docker compose -f docker-compose.backend.yml up -d
            docker image prune -f

  deploy-frontend:
    name: Deploy Frontend VM
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: SSH & deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONTEND_VM_HOST }}
          username: ${{ secrets.FRONTEND_VM_USER }}
          key: ${{ secrets.FRONTEND_VM_SSH_KEY }}
          script: |
            cd ~/octopi-saas-platform
            git pull origin main
            docker compose -f docker-compose.frontend.yml build --no-cache
            docker compose -f docker-compose.frontend.yml up -d
            docker image prune -f
